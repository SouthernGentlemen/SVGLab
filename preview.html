<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>SVGLab — preview loop</title>
  </head>
  <body>
    <main class="preview-shell">
      <header class="top-overlay preview-topbar">
        <div class="brand"><p>Unsafe local instrument</p><h1>Figure <span>/</span> Preview</h1></div>
        <div class="runtime-status">
          <span class="status-dot" aria-hidden="true"></span><span id="dev-status">catalog ready</span>
          <a class="preview-link" href="/">Fight stage</a>
          <button class="icon-button keybind-toggle" type="button" popovertarget="keybind-popover" aria-label="Keyboard shortcuts" title="Keyboard shortcuts"><span aria-hidden="true">⚙</span></button>
        </div>
      </header>

      <div id="keybind-popover" class="keybind-popover glass" popover>
        <p class="overlay-label">KEYBOARD</p>
        <ul id="keybind-list"></ul>
      </div>

      <aside class="preview-controls glass" aria-label="Figure preview controls">
        <p class="overlay-label">FIGURE + CLIP</p>
        <div class="preview-field"><label for="figure">Figure</label><select id="figure"></select></div>
        <div class="preview-field"><label for="clip">Clip</label><select id="clip"></select></div>
        <div class="preview-field"><label for="cosmetic">Cosmetic</label><select id="cosmetic"></select></div>

        <div class="toggle-grid preview-toggles">
          <label><input id="compare" type="checkbox" /> Compare all figures</label>
          <label><input id="face-left" type="checkbox" /> Face left</label>
          <label><input id="show-rig" type="checkbox" /> Bone pivots</label>
          <label><input id="show-skeleton" type="checkbox" /> Skeleton overlay</label>
        </div>

        <div class="preview-button-grid">
          <button id="previous-clip" type="button">Previous</button>
          <button id="next-clip" type="button">Next</button>
          <button id="play-pause" class="primary-button" type="button">Pause</button>
          <button id="step-frame" type="button">Step</button>
          <button id="replay" type="button">Replay</button>
        </div>

        <div class="preview-scrub">
          <div><label for="frame-scrub">Frame</label><output id="frame-output">0</output></div>
          <input id="frame-scrub" type="range" min="0" max="60" step="1" value="0" />
        </div>
      </aside>

      <section class="preview-stage glass" aria-label="Figure animation preview">
        <div class="preview-stage-header">
          <div><p class="overlay-label">LIVE FETCHED VECTOR PREVIEW</p><h2 id="stage-title">Loading…</h2></div>
          <span id="playback-state" class="tick-chip">playing</span>
        </div>
        <div id="single-view" class="single-view">
          <svg id="single-svg" viewBox="0 0 360 320" role="img" aria-label="Selected figure animation">
            <path class="preview-floor" d="M58 262H302" /><g id="single-rig"></g>
          </svg>
        </div>
        <div id="compare-view" class="compare-view" hidden></div>
      </section>

      <aside class="preview-readout glass" aria-label="Clip and rig facts">
        <section>
          <p class="overlay-label">CLIP</p>
          <dl class="preview-facts">
            <div><dt>Lane</dt><dd id="clip-lane">shipped</dd></div>
            <div><dt>Source loop</dt><dd id="clip-loop">—</dd></div>
          </dl>
        </section>
        <section>
          <p class="overlay-label">RIG CHECK</p>
          <p id="missing-bones" class="rig-note" hidden></p>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/shell/preview.ts"></script>
  </body>
</html>
