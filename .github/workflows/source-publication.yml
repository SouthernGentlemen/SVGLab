name: Source publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated stable source-release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: source-publication-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish verified source tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested tag syntax
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "source-publication: tag '$TAG' must match stable semantic form vX.Y.Z" >&2
            exit 1
          fi

      - name: Checkout exact SVGLab release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          path: SVGLab
          persist-credentials: false

      - name: Checkout pinned Boneyard sibling
        uses: actions/checkout@v7
        with:
          repository: SouthernGentlemen/Boneyard
          ref: 1f74f4b064b8578b4f40f5831c8e6dc1f8f96afd
          path: Boneyard
          persist-credentials: false

      - name: Resolve annotated release revision
        id: release
        working-directory: SVGLab
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG"
          object_type="$(git cat-file -t "$tag_ref")"
          if [[ "$object_type" != "tag" ]]; then
            echo "source-publication: $TAG must be an annotated tag; observed '$object_type'" >&2
            exit 1
          fi
          commit="$(git rev-parse --verify "$tag_ref^{commit}")"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source-publication: $TAG did not resolve to an exact commit SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$commit" ]]; then
            echo "source-publication: checkout does not match tagged commit $commit" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Use repository runtime authority
        uses: actions/setup-node@v6
        with:
          node-version-file: SVGLab/.node-version

      - name: Use committed npm version
        run: npm install --global npm@11.19.1

      - name: Install locked SVGLab dependencies
        working-directory: SVGLab
        run: npm ci

      - name: Complete canonical acceptance
        working-directory: SVGLab
        run: npm run check

      - name: Verify immutable release identity
        working-directory: SVGLab
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: npm run verify:release-identity -- --tag "$TAG" --commit "$COMMIT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv' 2>/dev/null)"; then
            if [[ "$existing" != $'false\tfalse' ]]; then
              echo "source-publication: existing release $TAG is draft or prerelease; refusing to mutate it" >&2
              exit 1
            fi
            echo "source-publication: GitHub Release $TAG is already published; no-op"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
