name: Verify aggressive local teardown

on:
  push:
    branches:
      - aggressive-local-teardown

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Prove dev nukes an occupied local port
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/svglab-blocker
          printf 'BLOCKER\n' >/tmp/svglab-blocker/index.html
          (cd /tmp/svglab-blocker && python3 -m http.server 8788 --bind 127.0.0.1 >/tmp/blocker.log 2>&1) &
          blocker_pid=$!
          sleep 0.5
          kill -0 "$blocker_pid"
          curl --fail --silent http://127.0.0.1:8788/ | grep -q BLOCKER

          SVGLAB_NO_OPEN=1 SVGLAB_PORT=8788 npm run dev >/tmp/svglab-dev.log 2>&1 &
          dev_pid=$!

          ready=0
          for attempt in {1..80}; do
            if curl --fail --silent --dump-header /tmp/svglab-headers.txt http://127.0.0.1:8788/ -o /tmp/svglab-page.html; then
              if grep -qi '^X-Combat-Lab-Mode: unsafe-local-only' /tmp/svglab-headers.txt; then
                ready=1
                break
              fi
            fi
            sleep 0.25
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/svglab-dev.log
            exit 1
          fi
          if lsof -nP -iTCP:8788 -sTCP:LISTEN -t | grep -qx "$blocker_pid"; then
            echo "blocker still owns port 8788"
            cat /tmp/svglab-dev.log
            exit 1
          fi
          grep -F "teardown: terminating local lab processes on port 8788" /tmp/svglab-dev.log
          grep -F "teardown: local port 8788 is clear" /tmp/svglab-dev.log
          grep -F "browser: skipped (SVGLAB_NO_OPEN=1); open http://127.0.0.1:8788/" /tmp/svglab-dev.log

          SVGLAB_PORT=8788 npm run teardown
          wait "$dev_pid" || true
          wait "$blocker_pid" || true
