name: Controlled delivery

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact SVGLab PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: SVGLab
          persist-credentials: false

      - name: Checkout pinned Boneyard sibling
        uses: actions/checkout@v7
        with:
          repository: SouthernGentlemen/Boneyard
          # Reproducible sibling authority with the shared Node/npm toolchain.
          ref: 1f74f4b064b8578b4f40f5831c8e6dc1f8f96afd
          path: Boneyard
          persist-credentials: false

      - name: Use repository runtime authority
        uses: actions/setup-node@v7
        with:
          node-version-file: SVGLab/.node-version

      - name: Use committed npm version
        run: npm install --global npm@11.19.1

      - name: Install locked SVGLab dependencies
        working-directory: SVGLab
        run: npm ci

      - name: Dependency advisories
        working-directory: SVGLab
        run: npm run audit:dependencies

      - name: Complete acceptance
        working-directory: SVGLab
        run: npm run check

      - name: Committed-range whitespace
        if: github.event_name == 'pull_request'
        working-directory: SVGLab
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
