name: Verify browser-opening dev lifecycle

on:
  push:
    branches:
      - open-browser-on-dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Smoke npm run dev readiness and browser handoff
        shell: bash
        run: |
          set -euo pipefail
          SVGLAB_NO_OPEN=1 SVGLAB_PORT=8788 npm run dev > /tmp/svglab-dev.log 2>&1 &
          dev_pid=$!
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8788/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8788/ >/dev/null
          grep -F "browser: skipped (SVGLAB_NO_OPEN=1); open http://127.0.0.1:8788/" /tmp/svglab-dev.log
          npm run teardown
          wait "$dev_pid" || true
